[package]
name = "wbkit"
version = "0.1.0"
edition = "2021"
description = "Package web games and apps for WebBox (.wbx)"
license = "MIT"
authors = ["WebBox"]
repository = "https://github.com/thejamesnick/wbkit"
homepage = "https://publish.webbox.fun/docs/wbkit"
readme = "README.md"
rust-version = "1.80"

[lib]
# The .wbx format engine, shared with WebBox runtimes. The command line program lives in src/bin/wbkit.
name = "wbkit_core"
path = "src/lib.rs"

[[bin]]
name = "wbkit"
path = "src/bin/wbkit/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
sha2 = "0.10"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
